# CI/CD — PayBot (build linux/arm64 + deploy via SSH)
# SDK compiles natively on the GitHub amd64 runner (no QEMU); the image is linux/arm64.
#
# Required GitHub secrets (repo or org):
#   SSH_HOST          — EC2 hostname or IP
#   SSH_USER          — SSH username
#   SSH_PRIVATE_KEY   — private key for SSH/SCP
#   SSH_PORT          — optional (default 22)
#
# The server .env lives at /www/.env and is not uploaded by this workflow.
# Trigger: published GitHub Release whose tag starts with v, or workflow_dispatch.

name: CI/CD

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: paybot-prod
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  BUILD_CONFIGURATION: Release

jobs:
  test:
    name: Test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test PayBot.slnx -c ${{ env.BUILD_CONFIGURATION }}

  build:
    name: Build paybot
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (linux/arm64)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          tags: paybot:latest
          load: true
          cache-from: type=gha,scope=paybot
          cache-to: type=gha,mode=max,scope=paybot

      - name: Save image tar
        run: docker save -o ${{ runner.temp }}/paybot.tar paybot:latest

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: paybot
          path: ${{ runner.temp }}/paybot.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: paybot
          path: deploy-stage

      - name: Stage compose files
        run: |
          set -euo pipefail
          mkdir -p deploy-stage/nginx deploy-stage/postgres/init
          cp docker-compose.yml deploy-stage/docker-compose.yml
          cp nginx/default.conf deploy-stage/nginx/default.conf
          cp postgres/init/01-paybot.sql deploy-stage/postgres/init/01-paybot.sql
          test -f deploy-stage/paybot.tar

      - name: SCP to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy-stage
          target: /tmp/gha-paybot
          strip_components: 1
          overwrite: true

      - name: Load image and recreate PayBot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            if [ ! -f /tmp/gha-paybot/paybot.tar ]; then
              echo "Missing staged image: paybot.tar"
              exit 1
            fi

            sudo mkdir -p /www/nginx /www/postgres/init /www/docker/latest /www/docker/bkp
            if [ -f /www/docker/latest/paybot.tar ]; then
              sudo cp /www/docker/latest/paybot.tar /www/docker/bkp/paybot.tar
            fi

            sudo cp /tmp/gha-paybot/paybot.tar /www/docker/latest/paybot.tar
            sudo cp /tmp/gha-paybot/docker-compose.yml /www/docker-compose.yml
            sudo cp /tmp/gha-paybot/nginx/default.conf /www/nginx/default.conf
            sudo cp /tmp/gha-paybot/postgres/init/01-paybot.sql /www/postgres/init/01-paybot.sql

            if [ ! -f /www/.env ]; then
              echo "Missing /www/.env. Create it on the server before deploying."
              exit 1
            fi

            sudo docker load --input /www/docker/latest/paybot.tar

            if ! sudo docker compose version >/dev/null 2>&1; then
              echo "docker compose plugin not found"
              exit 1
            fi

            # Root reads /www/.env (mode 600). The SSH user cannot.
            sudo docker compose --project-directory /www -p paybot pull nginx evolution postgres
            sudo docker compose --project-directory /www -p paybot up -d --pull never
            sudo docker compose --project-directory /www -p paybot up -d --pull never --no-deps --force-recreate paybot nginx
            sudo docker image prune -f || true
            rm -rf /tmp/gha-paybot || true
            echo "Deploy completed"

  cleanup-artifacts:
    name: Delete artifacts
    needs: [build, deploy]
    if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from this run
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            });
            for (const artifact of data.artifacts || []) {
              if (!artifact || !artifact.id) continue;
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }
